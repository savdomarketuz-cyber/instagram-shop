name: Typecheck

# Har push'da (main va boshqa branch'lar) TypeScript tekshiruvi.
# Lokal build/tsc qilinmaydi (xotira yetmaydi) — tekshiruv shu yerda.
# /usr/bin/time -v xotira (Maximum resident set size) va vaqtni chiqaradi.

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm run typecheck
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o time.txt npm run typecheck 2>&1 | tee tsc.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          errors=$(grep -cE 'error TS[0-9]+' tsc.txt || true)
          rss_kb=$(grep 'Maximum resident set size' time.txt | awk '{print $NF}')
          wall=$(grep 'Elapsed (wall clock)' time.txt | awk '{print $NF}')
          {
            echo "### Typecheck: ${errors} xato"
            echo ""
            echo "- Eng yuqori xotira: $(( ${rss_kb:-0} / 1024 )) MB"
            echo "- Vaqt: ${wall}"
            echo ""
            if [ "$errors" != "0" ]; then
              echo "| Xato | Fayl |"
              echo "|---:|---|"
              grep -oE '^[^(]+\([0-9]+,[0-9]+\): error TS' tsc.txt | sed -E 's/\(.*//' | sort | uniq -c | sort -rn | awk '{print "| "$1" | "$2" |"}'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat time.txt
