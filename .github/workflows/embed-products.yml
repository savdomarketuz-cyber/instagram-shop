name: Embed products (manual)

# Qidiruv embedding'lari: yangi va o'zgargan mahsulotlarning matn (gemini-embedding-001) va
# rasm (gemini-embedding-2) vektorlari. Faqat qo'lda — Actions → "Embed products (manual)" → Run workflow.
# Ega qarori: avtomatik jadval (cron) YO'Q. Odatda kompyuterda `npm run embed:all` yetadi.
# Kalitlar faqat repo secrets'da (DATABASE_URL, GEMINI_API_KEY_1, GEMINI_API_KEY_2); skriptlar ularni chop etmaydi.

on:
  workflow_dispatch: {}

concurrency:
  group: embed-products
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Embed new / changed products (text + images)
        run: npm run embed:all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
